<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>동영상 순차 자동재생</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0b0c;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    text-align: center;
    margin: 12px 0 16px;
  }
  .player-box {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
  }
  #player {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #player iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(0,0,0,0.55);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .overlay[hidden] { display: none; }
  .play-btn {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 18px rgba(0,0,0,0.4);
  }
  .play-btn::after {
    content: "";
    border-style: solid;
    border-width: 14px 0 14px 22px;
    border-color: transparent transparent transparent #111;
    margin-left: 4px;
  }
  .overlay-text {
    font-size: 14px;
    color: #fff;
    text-align: center;
    padding: 0 24px;
  }
  .status {
    margin-top: 12px;
    text-align: center;
    font-size: 14px;
    color: #b9b9bd;
  }
  .status strong { color: #fff; }
  .list {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .list-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: #1a1a1c;
    font-size: 13px;
    color: #cfcfd2;
  }
  .list-item.active {
    background: #2b2f38;
    color: #fff;
  }
  .list-item.done {
    color: #7d7d82;
  }
  .idx {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    flex-shrink: 0;
  }
  .list-item.active .idx { background: #4b8bff; }
  .list-item.done .idx { background: #2f6d3f; }
  .replay-btn {
    display: block;
    margin: 16px auto 0;
    padding: 10px 22px;
    border-radius: 999px;
    border: none;
    background: #4b8bff;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
  }
  .replay-btn[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>동영상 순차 자동재생</h1>

  <div class="player-box">
    <div id="player"></div>
    <div class="overlay" id="overlay">
      <div class="play-btn"></div>
      <div class="overlay-text">터치하면 전체 영상이<br>순서대로 이어서 재생됩니다</div>
    </div>
  </div>

  <div class="status" id="status">준비됨 · 총 <strong id="totalCount"></strong>개 영상</div>

  <div class="list" id="list"></div>

  <button class="replay-btn" id="replayBtn" hidden>처음부터 다시 재생</button>
</div>

<script src="https://player.vimeo.com/api/player.js"></script>
<script>
(function () {
  var videoIds = [
    "734614658",
    "733896097",
    "736710751",
    "734616968",
    "733940090",
    "736711026"
  ];

  var overlay = document.getElementById("overlay");
  var statusEl = document.getElementById("status");
  var listEl = document.getElementById("list");
  var replayBtn = document.getElementById("replayBtn");
  document.getElementById("totalCount").textContent = videoIds.length;

  var currentIndex = -1;
  var player = null;

  videoIds.forEach(function (id, i) {
    var item = document.createElement("div");
    item.className = "list-item";
    item.id = "item-" + i;
    item.innerHTML = '<span class="idx">' + (i + 1) + '</span><span>영상 ' + (i + 1) + '</span>';
    listEl.appendChild(item);
  });

  function setActive(i) {
    videoIds.forEach(function (_, idx) {
      var el = document.getElementById("item-" + idx);
      el.classList.remove("active", "done");
      if (idx < i) el.classList.add("done");
      if (idx === i) el.classList.add("active");
    });
    statusEl.innerHTML = "재생 중 · <strong>" + (i + 1) + " / " + videoIds.length + "</strong>";
  }

  function playIndex(i) {
    currentIndex = i;
    setActive(i);
    player.loadVideo(videoIds[i]).then(function () {
      return player.play();
    }).catch(function (err) {
      console.error("재생 오류:", err);
    });
  }

  function onEnded() {
    var next = currentIndex + 1;
    if (next < videoIds.length) {
      playIndex(next);
    } else {
      videoIds.forEach(function (_, idx) {
        document.getElementById("item-" + idx).classList.add("done");
        document.getElementById("item-" + idx).classList.remove("active");
      });
      statusEl.innerHTML = "<strong>전체 영상 재생 완료</strong>";
      replayBtn.hidden = false;
    }
  }

  function start() {
    overlay.hidden = true;
    replayBtn.hidden = true;

    if (!player) {
      player = new Vimeo.Player("player", {
        id: videoIds[0],
        autoplay: true,
        playsinline: true,
        controls: true,
        responsive: true
      });
      player.on("ended", onEnded);
      playIndex(0);
    } else {
      playIndex(0);
    }
  }

  overlay.addEventListener("click", start);
  replayBtn.addEventListener("click", start);
})();
</script>
</body>
</html>
