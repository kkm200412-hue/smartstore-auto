<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>아이누리 영상재생</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f4fb">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="아이누리 영상재생">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="fonts/Pretendard-SemiBold.subset.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Pretendard"; font-weight: 400; font-display: swap; src: url("fonts/Pretendard-Regular.subset.woff2") format("woff2"); }
  @font-face { font-family: "Pretendard"; font-weight: 600; font-display: swap; src: url("fonts/Pretendard-SemiBold.subset.woff2") format("woff2"); }
  @font-face { font-family: "Pretendard"; font-weight: 700; font-display: swap; src: url("fonts/Pretendard-Bold.subset.woff2") format("woff2"); }

  :root {
    --bg: #f6f4fb;
    --ink: #2d2a4a;
    --ink-dim: #6f6b8c;
    --ink-faint: #a5a1bd;
    --violet: #5b4fd6;
    --violet-soft: rgba(91, 79, 214, 0.14);
    --pink: #ff7aa8;
    --lilac: #8a7dff;
    --grad: linear-gradient(90deg, var(--pink), var(--lilac));
    --glass: rgba(255, 255, 255, 0.58);
    --glass-edge: rgba(255, 255, 255, 0.85);
    --glass-shadow: 0 8px 30px rgba(80, 70, 140, 0.10);
    --field: #f1eff8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
  }

  /* The page colour lives on <html>; a body background would paint over the
     fixed pastel blob layer behind it. */
  body {
    background: transparent;
    font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    padding: calc(22px + env(safe-area-inset-top)) 20px calc(110px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }

  button { font-family: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }

  .bg-blobs {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(60% 40% at 12% 8%, #ffd9e6 0%, transparent 70%),
      radial-gradient(60% 45% at 92% 22%, #d6e8ff 0%, transparent 70%),
      radial-gradient(70% 50% at 50% 100%, #e3dcff 0%, transparent 70%),
      var(--bg);
  }

  .glass {
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    box-shadow: var(--glass-shadow);
  }

  .stage { max-width: 480px; margin: 0 auto; }

  /* --- header --- */

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.01em;
  }

  .brand img { width: 32px; height: 32px; border-radius: 10px; }

  .round-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--ink-dim);
    padding: 0;
  }

  .round-btn svg { width: 19px; height: 19px; }

  h1 {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.32;
    letter-spacing: -0.025em;
    margin: 28px 0 6px;
    text-wrap: balance;
  }

  h1 em {
    font-style: normal;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    margin: 0;
    font-size: 14px;
    color: var(--ink-dim);
    line-height: 1.55;
  }

  .sub b { color: var(--ink); font-weight: 600; }

  /* --- install banner --- */

  .install-banner {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
    padding: 12px;
    border-radius: 20px;
  }

  .install-banner[hidden] { display: none; }
  .install-banner img { width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0; }

  .install-text {
    flex: 1;
    min-width: 0;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink-dim);
  }

  .install-text b { color: var(--ink); font-weight: 600; }

  .install-btn {
    flex-shrink: 0;
    padding: 9px 16px;
    border-radius: 999px;
    border: none;
    background: var(--grad);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
  }

  /* --- player card --- */

  .player-card {
    margin-top: 20px;
    border-radius: 28px;
    padding: 10px;
  }

  .screen {
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: 20px;
    overflow: hidden;
    background: linear-gradient(135deg, #ffc7da, #b9b2ff 60%, #9fd2ff);
  }

  #player { position: absolute; inset: 0; }
  #player iframe { width: 100%; height: 100%; border: 0; display: block; }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: grid;
    place-items: center;
    border: none;
    padding: 0;
    background: linear-gradient(135deg, rgba(255, 199, 218, 0.55), rgba(185, 178, 255, 0.5) 60%, rgba(159, 210, 255, 0.5));
  }

  .overlay[hidden] { display: none; }

  .play-btn {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.92);
    display: grid;
    place-items: center;
    box-shadow: 0 10px 26px rgba(80, 70, 140, 0.28);
    transition: transform 0.15s ease;
  }

  .overlay:active .play-btn { transform: scale(0.94); }

  .play-btn::after {
    content: "";
    border-style: solid;
    border-width: 12px 0 12px 19px;
    border-color: transparent transparent transparent var(--violet);
    margin-left: 5px;
  }

  .fs-btn {
    position: absolute;
    z-index: 5;
    right: 10px;
    bottom: 10px;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.5);
    background: rgba(45, 42, 74, 0.45);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: #fff;
    display: grid;
    place-items: center;
    padding: 0;
  }

  .fs-btn[hidden] { display: none; }
  .fs-btn svg { width: 18px; height: 18px; }

  .now {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 8px 4px;
  }

  .now b {
    font-size: 15.5px;
    font-weight: 700;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .now span {
    flex-shrink: 0;
    font-size: 12.5px;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }

  .dots {
    display: flex;
    gap: 5px;
    padding: 10px 8px 8px;
  }

  .seg {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: var(--violet-soft);
    overflow: hidden;
    position: relative;
  }

  .seg-fill {
    position: absolute;
    inset: 0;
    width: 0%;
    border-radius: 3px;
    background: var(--grad);
    transition: width 0.2s linear;
  }

  .seg.done .seg-fill { width: 100%; }

  .replay-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border-radius: 18px;
    font-size: 14.5px;
    font-weight: 700;
    color: var(--violet);
  }

  .replay-btn[hidden] { display: none; }

  /* --- this month's videos --- */

  .sec-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 26px 4px 12px;
    font-size: 14px;
    font-weight: 700;
  }

  .sec-title span { font-size: 12.5px; font-weight: 400; color: var(--ink-dim); }

  .chips {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    margin: 0 -20px;
    padding: 4px 20px 8px;
    scrollbar-width: none;
  }

  .chips::-webkit-scrollbar { display: none; }

  .clip {
    flex: 0 0 152px;
    scroll-snap-align: start;
    text-align: left;
    border-radius: 22px;
    padding: 8px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    /* Plain frosted white instead of live blur: cheaper to redraw while the row scrolls. */
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    background: rgba(255, 255, 255, 0.72);
  }

  .clip:active { transform: scale(0.97); }

  .clip-thumb {
    position: relative;
    aspect-ratio: 16 / 10;
    border-radius: 15px;
    background-size: cover;
    background-position: center;
  }

  .clip-idx {
    position: absolute;
    left: 8px;
    top: 8px;
    min-width: 24px;
    height: 24px;
    padding: 0 7px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.92);
    color: var(--violet);
    font-size: 12px;
    font-weight: 700;
    display: grid;
    place-items: center;
  }

  .clip-label {
    display: block;
    margin: 9px 4px 2px;
    font-size: 13.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .clip-meta {
    display: block;
    margin: 0 4px 2px;
    font-size: 11.5px;
    color: var(--ink-dim);
    min-height: 1.4em;
  }

  .clip.active {
    border-color: rgba(138, 125, 255, 0.55);
    box-shadow: 0 0 0 2px rgba(138, 125, 255, 0.35), var(--glass-shadow);
  }

  .clip.active .clip-idx { background: var(--violet); color: #fff; }
  .clip.done .clip-thumb { opacity: 0.55; }
  .clip.done .clip-meta::after { content: " · 봤어요"; color: var(--violet); }

  /* --- floating QR button --- */

  .fab {
    position: fixed;
    z-index: 10;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(20px + env(safe-area-inset-bottom));
    width: calc(100% - 40px);
    max-width: 440px;
    height: 56px;
    border: none;
    border-radius: 20px;
    background: var(--grad);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 12px 26px rgba(138, 125, 255, 0.38);
  }

  .fab svg { width: 20px; height: 20px; }
  .fab:active { transform: translateX(-50%) scale(0.98); }

  /* --- settings sheet --- */

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(45, 42, 74, 0.35);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .modal-backdrop[hidden] { display: none; }

  .modal {
    width: 100%;
    max-width: 480px;
    max-height: 88vh;
    overflow-y: auto;
    background: rgba(255, 255, 255, 0.94);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border-radius: 28px 28px 0 0;
    padding: 10px 20px calc(24px + env(safe-area-inset-bottom));
    box-shadow: 0 -10px 40px rgba(80, 70, 140, 0.18);
  }

  .modal::before {
    content: "";
    display: block;
    width: 40px;
    height: 5px;
    border-radius: 3px;
    background: #dcd8ea;
    margin: 0 auto 14px;
  }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-head h2 { font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }

  .close-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: var(--field);
    color: var(--ink-dim);
    display: grid;
    place-items: center;
    padding: 0;
  }

  .close-btn svg { width: 16px; height: 16px; }

  .modal-hint {
    font-size: 13px;
    color: var(--ink-dim);
    margin: 8px 0 16px;
    line-height: 1.6;
  }

  .link-rows {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
  }

  .link-row { display: flex; align-items: center; gap: 8px; }

  .link-row::before {
    counter-increment: row;
    content: counter(row);
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--violet-soft);
    color: var(--violet);
    font-size: 12px;
    font-weight: 700;
    display: grid;
    place-items: center;
  }

  .link-rows { counter-reset: row; }

  .link-input {
    flex: 1;
    min-width: 0;
    background: var(--field);
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 11px 12px;
    color: var(--ink);
    font-size: 13px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  .link-input:focus { outline: none; border-color: var(--lilac); background: #fff; }

  .remove-row-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 12px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    font-size: 15px;
  }

  .remove-row-btn:active { background: var(--field); color: var(--ink); }

  .add-row-group { display: flex; gap: 8px; margin-bottom: 18px; }

  .add-row-btn {
    flex: 1;
    min-width: 0;
    padding: 12px 8px;
    border-radius: 14px;
    border: 1.5px dashed #d9d4ee;
    background: transparent;
    color: var(--ink-dim);
    font-size: 13px;
    font-weight: 600;
  }

  .add-row-btn:active { border-color: var(--lilac); color: var(--violet); }

  .save-btn {
    width: 100%;
    padding: 15px;
    border-radius: 16px;
    border: none;
    background: var(--grad);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    box-shadow: 0 10px 22px rgba(138, 125, 255, 0.3);
  }

  .share-box {
    margin-top: 18px;
    padding: 14px;
    border-radius: 18px;
    background: var(--field);
  }

  .share-box[hidden] { display: none; }

  .share-label { font-size: 12px; font-weight: 600; color: var(--ink-dim); margin-bottom: 8px; }

  .share-row { display: flex; gap: 8px; }

  .share-input {
    flex: 1;
    min-width: 0;
    background: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--ink-dim);
    font-size: 12px;
  }

  .copy-btn {
    flex-shrink: 0;
    padding: 0 18px;
    border-radius: 10px;
    border: none;
    background: var(--violet);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
  }

  .share-copied { margin-top: 8px; font-size: 12.5px; color: var(--violet); font-weight: 600; }
  .share-copied[hidden] { display: none; }

  /* --- QR scanner --- */

  .scanner-overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: #000;
    display: flex;
    flex-direction: column;
  }

  .scanner-overlay[hidden] { display: none; }

  .scanner-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
  }

  .scanner-head .close-btn { background: rgba(255, 255, 255, 0.16); color: #fff; }

  .scanner-video-wrap { position: relative; flex: 1; overflow: hidden; background: #000; }
  .scanner-video-wrap video { width: 100%; height: 100%; object-fit: cover; }

  .scan-frame {
    position: absolute;
    top: 42%;
    left: 50%;
    width: min(68vw, 280px);
    height: min(68vw, 280px);
    transform: translate(-50%, -50%);
    pointer-events: none;
    filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.55));
  }

  .scan-frame > div {
    position: absolute;
    width: 30px;
    height: 30px;
    border: 0 solid #fff;
    transition: border-color 0.15s;
  }

  .corner-tl { top: 0; left: 0; border-top-width: 3px !important; border-left-width: 3px !important; border-top-left-radius: 14px; }
  .corner-tr { top: 0; right: 0; border-top-width: 3px !important; border-right-width: 3px !important; border-top-right-radius: 14px; }
  .corner-bl { bottom: 0; left: 0; border-bottom-width: 3px !important; border-left-width: 3px !important; border-bottom-left-radius: 14px; }
  .corner-br { bottom: 0; right: 0; border-bottom-width: 3px !important; border-right-width: 3px !important; border-bottom-right-radius: 14px; }

  .scan-frame.hit > div { border-color: #5ee2a0; }

  .scan-status {
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100% - 32px);
    text-align: center;
    color: #fff;
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 999px;
    background: rgba(45, 42, 74, 0.75);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }

  .scan-status:empty { display: none; }

  .scan-batch {
    background: rgba(255, 255, 255, 0.96);
    border-radius: 24px 24px 0 0;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .scan-batch[hidden] { display: none; }

  .scan-batch-list { display: flex; gap: 8px; overflow-x: auto; min-height: 34px; align-items: center; }
  .scan-batch-empty { font-size: 13px; color: var(--ink-dim); }

  .scan-chip {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px 5px 5px;
    border-radius: 999px;
    background: var(--field);
    font-size: 11.5px;
    color: var(--ink-dim);
  }

  .scan-chip b {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--grad);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 11px;
  }

  .scan-batch-actions { display: flex; gap: 8px; }
  .scan-batch-actions .save-btn { flex: 1; }

  .scan-undo {
    flex-shrink: 0;
    padding: 0 16px;
    border-radius: 16px;
    border: none;
    background: var(--field);
    color: var(--ink-dim);
    font-size: 13px;
    font-weight: 600;
  }

  .scan-undo:disabled { opacity: 0.45; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<div class="bg-blobs"></div>

<main class="stage">
  <header class="top">
    <div class="brand"><img src="icons/icon-192.png" alt="">아이누리</div>
    <button class="round-btn glass" id="settingsBtn" type="button" aria-label="영상 링크 관리">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <h1><em id="monthLabel">이번 달</em> 영상이<br>도착했어요</h1>
  <p class="sub">한 번 누르면 <b><span id="countLabel1">6</span>개 영상</b>이 차례로 이어서 나와요</p>

  <div class="install-banner glass" id="installBanner" hidden>
    <img src="icons/icon-192.png" alt="">

<div class="scanner-overlay" id="scannerOverlay" hidden>
  <div class="scanner-head">
    <span id="scannerTitle">QR 코드를 화면 중앙에 맞춰주세요</span>
    <button class="close-btn" id="scannerCancel" type="button" aria-label="취소">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="scanner-video-wrap">
    <video id="scanVideo" playsinline autoplay muted></video>
    <div class="scan-frame" id="scanFrame">
      <div class="corner-tl"></div>
      <div class="corner-tr"></div>

  </div>

    <div class="scan-batch-list" id="scanBatchList"></div>

      <button class="scan-undo" id="scanUndo" type="button">마지막 취소</button>
      <button class="save-btn" id="scanDone" type="button">완료</button>

<canvas id="scanCanvas" style="display:none"></canvas>

<script src="https://player.vimeo.com/api/player.js"></script>
<script src="jsQR.js"></script>
<script>
(function () {
  var DEFAULT_IDS = [
    "734614658",
    "733896097",
    "736710751",
    "734616968",
    "733940090",
    "736711026"
  ];

  var overlay = document.getElementById("overlay");
  var recText = document.getElementById("recText");
  var nowTitle = document.getElementById("nowTitle");
  var monthLabel = document.getElementById("monthLabel");
  var timelineEl = document.getElementById("timeline");
  var clipsEl = document.getElementById("clips");
  var replayBtn = document.getElementById("replayBtn");
  var fsBtn = document.getElementById("fsBtn");
  var countLabel1 = document.getElementById("countLabel1");

  var settingsBtn = document.getElementById("settingsBtn");
  var settingsModal = document.getElementById("settingsModal");
  var closeSettingsBtn = document.getElementById("closeSettings");
  var linkRowsEl = document.getElementById("linkRows");
  var addRowBtn = document.getElementById("addRowBtn");
  var saveSettingsBtn = document.getElementById("saveSettings");
  var shareBox = document.getElementById("shareBox");
  var shareInput = document.getElementById("shareInput");
  var copyShareBtn = document.getElementById("copyShare");
  var copiedNote = document.getElementById("copiedNote");

  var quickScanBtn = document.getElementById("quickScanBtn");
  var scanAddBtn = document.getElementById("scanAddBtn");
  var scannerOverlay = document.getElementById("scannerOverlay");
  var scannerTitle = document.getElementById("scannerTitle");
  var scannerCancel = document.getElementById("scannerCancel");
  var scanVideo = document.getElementById("scanVideo");
  var scanCanvas = document.getElementById("scanCanvas");
  var scanStatus = document.getElementById("scanStatus");

  var videoIds = loadIds();
  var currentIndex = -1;
  var player = null;
  var loadedId = null;
  var scannerStream = null;
  var scanRafId = null;
  var scanMode = "batch";
  var batchIds = [];
  var scanFrame = document.getElementById("scanFrame");
  var scanBatch = document.getElementById("scanBatch");
  var scanBatchList = document.getElementById("scanBatchList");
  var scanUndo = document.getElementById("scanUndo");
  var scanDone = document.getElementById("scanDone");

  function extractVimeoId(raw) {
    if (!raw) return null;
    raw = raw.trim();
    var m = raw.match(/vimeo\.com\/(?:video\/)?(\d+)/i);
    if (m) return m[1];
    if (/^\d+$/.test(raw)) return raw;
    return null;
  }

  function loadIds() {
    try {
      var params = new URLSearchParams(window.location.search);
      var raw = params.get("ids");
      if (raw) {
        var fromUrl = raw.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
        if (fromUrl.length) return fromUrl;
      }
    } catch (e) {}
    try {
      var stored = localStorage.getItem("playlistIds");
      if (stored) {
        var arr = JSON.parse(stored);
        if (Array.isArray(arr) && arr.length) return arr;
      }
    } catch (e) {}
    return DEFAULT_IDS.slice();
  }

  function persistIds(ids) {
    var month = new Date().getMonth() + 1;
    try {
      localStorage.setItem("playlistIds", JSON.stringify(ids));
      localStorage.setItem("playlistMonth", String(month));
    } catch (e) {}
    try {
      var url = new URL(window.location.href);
      url.searchParams.set("ids", ids.join(","));
      url.searchParams.set("m", String(month));
      history.replaceState(null, "", url.toString());
    } catch (e) {}
    renderMonth();
  }

  function renderMonth() {
    var m = null;
    try { m = new URLSearchParams(window.location.search).get("m"); } catch (e) {}
    if (!m) { try { m = localStorage.getItem("playlistMonth"); } catch (e) {} }
    var n = parseInt(m, 10);
    monthLabel.textContent = n >= 1 && n <= 12 ? n + "월의" : "이번 달";
  }

  function fmtDuration(sec) {
    sec = Math.round(sec || 0);
    return Math.floor(sec / 60) + ":" + ("0" + (sec % 60)).slice(-2);
  }

  // --- video titles, thumbnails, lengths from Vimeo (oEmbed) ---
  // Falls back to a pastel card + "N번 영상" when a video is private/unlisted.

  var PASTELS = [
    ["#ffd6e4", "#ff9fbf"], ["#d9e9ff", "#93bfff"], ["#e6e0ff", "#b1a6ff"],
    ["#d8f5ea", "#8fdcc0"], ["#fff0cc", "#ffd27a"], ["#ffe1d6", "#ffab8f"]
  ];
  var metas = {};

  function loadMeta(id) {
    if (metas[id]) return Promise.resolve(metas[id]);
    try {
      var cached = JSON.parse(localStorage.getItem("vmeta:" + id) || "null");
      if (cached) { metas[id] = cached; return Promise.resolve(cached); }
    } catch (e) {}
    return fetch("https://vimeo.com/api/oembed.json?width=640&url=" +
      encodeURIComponent("https://vimeo.com/" + id))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) return null;
        var thumb = typeof d.thumbnail_url === "string" && /^https:\/\/i\.vimeocdn\.com\//.test(d.thumbnail_url)
          ? d.thumbnail_url : null;
        var meta = { title: d.title || "", thumb: thumb, dur: d.duration || 0 };
        metas[id] = meta;
        try { localStorage.setItem("vmeta:" + id, JSON.stringify(meta)); } catch (e) {}
        return meta;
      })
      .catch(function () { return null; });
  }

  function titleFor(i) {
    var m = metas[videoIds[i]];
    return (m && m.title) || (i + 1) + "번 영상";
  }

  function applyMeta(i) {
    var clip = document.getElementById("clip-" + i);
    var m = metas[videoIds[i]];
    if (!clip || !m) return;
    if (m.thumb) clip.querySelector(".clip-thumb").style.backgroundImage = 'url("' + m.thumb + '")';
    clip.querySelector(".clip-label").textContent = titleFor(i);
    clip.querySelector(".clip-meta").textContent = m.dur ? fmtDuration(m.dur) : "";
    if (i === Math.max(currentIndex, 0)) nowTitle.textContent = titleFor(i);
    updateCountLabels();
  }

  function updateCountLabels() {
    countLabel1.textContent = videoIds.length;
    if (currentIndex >= 0) return;
    var total = 0;
    var known = videoIds.every(function (id) {
      var m = metas[id];
      if (m && m.dur) { total += m.dur; return true; }
      return false;
    });
    recText.textContent = "전체 " + videoIds.length + "개" +
      (known && total ? " · 약 " + Math.max(1, Math.round(total / 60)) + "분" : "");
  }

  function renderList() {
    timelineEl.innerHTML = "";
    clipsEl.innerHTML = "";
    videoIds.forEach(function (id, i) {
      var seg = document.createElement("div");
      seg.className = "seg";
      seg.id = "seg-" + i;
      seg.innerHTML = '<div class="seg-fill"></div>';
      timelineEl.appendChild(seg);

      var p = PASTELS[i % PASTELS.length];
      var clip = document.createElement("button");
      clip.type = "button";
      clip.className = "clip glass";
      clip.id = "clip-" + i;
      clip.innerHTML =
        '<span class="clip-thumb" style="display:block;background-image:linear-gradient(135deg,' + p[0] + ',' + p[1] + ')">' +
        '<span class="clip-idx">' + (i + 1) + '</span></span>' +
        '<span class="clip-label"></span><span class="clip-meta"></span>';
      clip.querySelector(".clip-label").textContent = (i + 1) + "번 영상";
      clip.addEventListener("click", function () { start(i); });
      clipsEl.appendChild(clip);

      loadMeta(id).then(function () { if (videoIds[i] === id) applyMeta(i); });
    });
    nowTitle.textContent = titleFor(0);
    updateCountLabels();
  }

  function setActive(i) {
    videoIds.forEach(function (_, idx) {
      var clip = document.getElementById("clip-" + idx);
      var seg = document.getElementById("seg-" + idx);
      clip.classList.remove("active", "done");
      seg.classList.remove("done");
      var fill = seg.querySelector(".seg-fill");
      fill.style.width = "";
      if (idx < i) { clip.classList.add("done"); seg.classList.add("done"); }
      if (idx === i) { clip.classList.add("active"); fill.style.width = "0%"; }
    });
    nowTitle.textContent = titleFor(i);
    recText.textContent = (i + 1) + " / " + videoIds.length;
    var active = document.getElementById("clip-" + i);
    if (active && active.scrollIntoView) {
      try { active.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" }); } catch (e) {}
    }
  }

  function soundOn() {
    player.setVolume(1).catch(function () {});
    return player.setMuted(false).catch(function () {});
  }

  function playIndex(i) {
    currentIndex = i;
    setActive(i);
    // The first video is preloaded, so play it straight away while the tap
    // still counts as a user gesture; that's what lets it start with sound.
    if (loadedId === videoIds[i]) {
      soundOn();
      player.play().catch(function (err) { console.error("재생 오류:", err); });
      return;
    }
    player.loadVideo(videoIds[i]).then(function () {
      loadedId = videoIds[i];
      soundOn();
      return player.play();
    }).catch(function (err) {
      console.error("재생 오류:", err);
    });
  }

  function onEnded() {
    var next = currentIndex + 1;
    if (next < videoIds.length) {
      playIndex(next);
    } else {
      videoIds.forEach(function (_, idx) {
        document.getElementById("clip-" + idx).classList.add("done");
        document.getElementById("clip-" + idx).classList.remove("active");
        document.getElementById("seg-" + idx).classList.add("done");
      });
      recText.textContent = "다 봤어요";
      if (player && typeof player.exitFullscreen === "function") {
        player.exitFullscreen().catch(function () {});
      }
      unlockOrientation();
      fsBtn.hidden = true;
      replayBtn.hidden = false;
    }
  }

  function onTimeUpdate(data) {
    var seg = document.getElementById("seg-" + currentIndex);
    if (seg && data.duration) {
      seg.querySelector(".seg-fill").style.width = Math.min(100, (data.seconds / data.duration) * 100) + "%";
    }
  }

  // Built up front (not on tap) and without Vimeo's autoplay flag: Vimeo
  // force-mutes autoplayed embeds, which is why playback used to start muted.
  // allow="autoplay" lets the parent page's tap unlock sound inside the iframe.
  function createPlayer() {
    if (!window.Vimeo) return;
    var holder = document.getElementById("player");
    holder.innerHTML = "";
    var iframe = document.createElement("iframe");
    iframe.src = "https://player.vimeo.com/video/" + videoIds[0] +
      "?autoplay=0&muted=0&playsinline=1&controls=1";
    iframe.setAttribute("allow", "autoplay; fullscreen; picture-in-picture; encrypted-media");
    iframe.setAttribute("allowfullscreen", "");
    holder.appendChild(iframe);
    player = new Vimeo.Player(iframe);
    loadedId = videoIds[0];
    player.on("ended", onEnded);
    player.on("timeupdate", onTimeUpdate);
    player.on("play", function () {
      player.getMuted().then(function (muted) { if (muted) soundOn(); }).catch(function () {});
    });
  }

  // fromIndex is set when a video card is tapped; as a click handler this
  // receives an Event, which means "from the first video".
  function start(fromIndex) {
    var from = typeof fromIndex === "number" ? fromIndex : 0;
    if (!player) createPlayer();
    if (!player) {
      alert("영상 플레이어를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 열어주세요.");
      return;
    }
    overlay.hidden = true;
    replayBtn.hidden = true;
    fsBtn.hidden = false;

    // Must be requested inside this click handler (same user gesture) or
    // mobile browsers silently ignore it. The actual orientation lock is
    // handled by the fullscreenchange listener below, once the browser has
    // really entered fullscreen (Vimeo's promise resolves on postMessage
    // round-trip, not on the real fullscreenchange event, so locking here
    // directly is too early and fails silently).
    if (typeof player.requestFullscreen === "function") {
      player.requestFullscreen().catch(function () {});
    }

    playIndex(from);
  }

  function toggleFullscreen() {
    if (!player) {
      start();
      return;
    }
    var fsElement = document.fullscreenElement || document.webkitFullscreenElement;
    if (fsElement) {
      if (document.exitFullscreen) document.exitFullscreen().catch(function () {});
      else if (typeof player.exitFullscreen === "function") player.exitFullscreen().catch(function () {});
    } else if (typeof player.requestFullscreen === "function") {
      player.requestFullscreen().catch(function () {});
    }
  }

  function lockLandscape() {
    // Orientation lock only works while the page is fullscreen, and only
    // Chromium-based mobile browsers implement it (iOS Safari has no
    // equivalent API, so there the viewer has to rotate the phone by hand).
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock("landscape").catch(function () {});
    }
  }

  function unlockOrientation() {
    if (screen.orientation && screen.orientation.unlock) {
      try { screen.orientation.unlock(); } catch (e) {}
    }
  }

  ["fullscreenchange", "webkitfullscreenchange"].forEach(function (evt) {
    document.addEventListener(evt, function () {
      var fsElement = document.fullscreenElement || document.webkitFullscreenElement;
      if (fsElement) {
        lockLandscape();
      } else {
        unlockOrientation();
      }
    });
  });

  function resetPlaybackState(newIds) {
    videoIds = newIds;
    currentIndex = -1;
    overlay.hidden = false;
    replayBtn.hidden = true;
    fsBtn.hidden = true;
    renderList();
    if (player) {
      var old = player;
      player = null;
      old.destroy().catch(function () {}).then(function () {
        if (!player) createPlayer();
      });
    } else {
      createPlayer();
    }
  }

  // --- QR scanner ---

  var detector = null;

  function nativeDetector() {
    if (!("BarcodeDetector" in window)) return null;
    try { return new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { return null; }
  }

  function openScanner(mode) {
    detector = nativeDetector();
    if (!detector && typeof jsQR !== "function") {
      alert("QR 인식 기능을 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 시도해주세요.");
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert("이 브라우저는 카메라 스캔을 지원하지 않습니다.");
      return;
    }

    scanMode = mode;
    batchIds = [];
    scanBatch.hidden = mode !== "batch";
    if (mode === "batch") {
      renderBatch();
    } else {
      scannerTitle.textContent = "추가할 QR 코드를 화면 중앙에 맞춰주세요";
    }
    scanStatus.textContent = "카메라를 여는 중...";
    scannerOverlay.hidden = false;

    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } })
      .then(function (stream) {
        scannerStream = stream;
        scanVideo.srcObject = stream;
        scanVideo.play();
        scanStatus.textContent = "";
        scanRafId = requestAnimationFrame(tickScan);
      })
      .catch(function () {
        scanStatus.textContent = "카메라를 사용할 수 없습니다. 브라우저 설정에서 카메라 권한을 허용해주세요.";
      });
  }

  function closeScanner() {
    scannerOverlay.hidden = true;
    if (scanRafId) {
      cancelAnimationFrame(scanRafId);
      scanRafId = null;
    }
    if (scannerStream) {
      scannerStream.getTracks().forEach(function (t) { t.stop(); });
      scannerStream = null;
    }
    scanVideo.srcObject = null;
  }

  function tickScan() {
    if (!scannerStream) return;
    if (detector && scanVideo.readyState >= 2) {
      detector.detect(scanVideo).then(function (codes) {
        if (!scannerStream) return;
        if (codes.length && codes[0].rawValue) {
          onQrDetected(codes[0].rawValue);
          return;
        }
        scanRafId = requestAnimationFrame(tickScan);
      }).catch(function () {
        detector = null;
        scanRafId = requestAnimationFrame(tickScan);
      });
      return;
    }
    if (typeof jsQR === "function" && scanVideo.readyState === scanVideo.HAVE_ENOUGH_DATA) {
      scanCanvas.width = scanVideo.videoWidth;
      scanCanvas.height = scanVideo.videoHeight;
      var ctx = scanCanvas.getContext("2d");
      ctx.drawImage(scanVideo, 0, 0, scanCanvas.width, scanCanvas.height);
      var imageData = null;
      try {
        imageData = ctx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
      } catch (e) {}
      if (imageData) {
        var code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
        if (code && code.data) {
          onQrDetected(code.data);
          return;
        }
      }
    }
    scanRafId = requestAnimationFrame(tickScan);
  }

  function onQrDetected(text) {
    var id = extractVimeoId(text);
    if (scanMode === "batch") {
      handleBatchScan(id);
      return;
    }
    closeScanner();
    if (!id) {
      alert("QR 코드에서 Vimeo 링크를 찾지 못했어요.\n인식된 내용: " + text);
      return;
    }
    if (!settingsModal.hidden) addRow(id);
  }

  // --- batch mode: scan every QR in order, then save them all at once ---

  function resumeScan(delayMs) {
    setTimeout(function () {
      if (scannerStream) scanRafId = requestAnimationFrame(tickScan);
    }, delayMs);
  }

  function flashHit() {
    scanFrame.classList.add("hit");
    setTimeout(function () { scanFrame.classList.remove("hit"); }, 700);
    if (navigator.vibrate) navigator.vibrate(80);
  }

  function handleBatchScan(id) {
    if (!id) {
      scanStatus.textContent = "Vimeo 영상 QR이 아니에요. 다른 QR을 비춰주세요.";
      resumeScan(1500);
      return;
    }
    var existing = batchIds.indexOf(id);
    if (existing !== -1) {
      scanStatus.textContent = "이미 " + (existing + 1) + "번으로 저장된 영상이에요.";
      resumeScan(1200);
      return;
    }
    batchIds.push(id);
    flashHit();
    scanStatus.textContent = batchIds.length + "번 영상 저장됨 ✓";
    renderBatch();
    // Pause briefly so the same code isn't re-read while the phone moves to the next one.
    resumeScan(1200);
  }

  function renderBatch() {
    scannerTitle.textContent = (batchIds.length + 1) + "번 영상 QR을 화면 중앙에 맞춰주세요";
    scanBatchList.innerHTML = "";
    if (!batchIds.length) {
      var empty = document.createElement("div");
      empty.className = "scan-batch-empty";
      empty.textContent = "QR을 찍는 순서대로 1번, 2번… 으로 저장됩니다";
      scanBatchList.appendChild(empty);
    }
    batchIds.forEach(function (id, i) {
      var chip = document.createElement("div");
      chip.className = "scan-chip";
      chip.innerHTML = '<b>' + (i + 1) + '</b><span class="mono">' + id + '</span>';
      scanBatchList.appendChild(chip);
    });
    scanBatchList.scrollLeft = scanBatchList.scrollWidth;
    scanUndo.disabled = !batchIds.length;
    scanDone.textContent = batchIds.length ? "완료 · " + batchIds.length + "개 저장" : "완료";
  }

  function undoBatch() {
    batchIds.pop();
    scanStatus.textContent = "";
    renderBatch();
  }

  function finishBatch() {
    var ids = batchIds.slice();
    closeScanner();
    if (!ids.length) return;
    persistIds(ids);
    resetPlaybackState(ids);
    openSettings();
    shareInput.value = window.location.href;
    shareBox.hidden = false;
    copiedNote.hidden = true;
  }

  function cancelScanner() {
    if (scanMode === "batch" && batchIds.length &&
        !confirm("찍은 QR " + batchIds.length + "개를 저장하지 않고 닫을까요?")) {
      return;
    }
    closeScanner();
  }

  // --- settings modal ---

  function addRow(value) {
    var row = document.createElement("div");
    row.className = "link-row";
    var input = document.createElement("input");
    input.className = "link-input";
    input.type = "text";
    input.placeholder = "Vimeo 링크 또는 ID";
    input.value = value || "";
    var removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "remove-row-btn";
    removeBtn.setAttribute("aria-label", "삭제");
    removeBtn.textContent = "✕";
    removeBtn.addEventListener("click", function () { row.remove(); });
    row.appendChild(input);
    row.appendChild(removeBtn);
    linkRowsEl.appendChild(row);
  }

  function openSettings() {
    linkRowsEl.innerHTML = "";
    videoIds.forEach(function (id) { addRow(id); });
    shareBox.hidden = true;
    copiedNote.hidden = true;
    settingsModal.hidden = false;
  }

  function closeSettings() {
    settingsModal.hidden = true;
  }

  function handleSave() {
    var inputs = linkRowsEl.querySelectorAll(".link-input");
    var ids = [];
    inputs.forEach(function (input) {
      var id = extractVimeoId(input.value);
      if (id) ids.push(id);
    });
    if (!ids.length) {
      alert("링크를 최소 1개 이상 입력해주세요.");
      return;
    }
    persistIds(ids);
    resetPlaybackState(ids);
    shareInput.value = window.location.href;
    shareBox.hidden = false;
    copiedNote.hidden = true;
  }

  function copyShareLink() {
    shareInput.focus();
    shareInput.select();
    var done = function () {
      copiedNote.hidden = false;
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(shareInput.value).then(done).catch(function () {
        try { document.execCommand("copy"); done(); } catch (e) {}
      });
    } else {
      try { document.execCommand("copy"); done(); } catch (e) {}
    }
  }

  renderMonth();
  renderList();
  createPlayer();

  overlay.addEventListener("click", start);
  replayBtn.addEventListener("click", start);
  fsBtn.addEventListener("click", toggleFullscreen);

  settingsBtn.addEventListener("click", openSettings);
  closeSettingsBtn.addEventListener("click", closeSettings);
  settingsModal.addEventListener("click", function (e) {
    if (e.target === settingsModal) closeSettings();
  });
  addRowBtn.addEventListener("click", function () { addRow(""); });
  saveSettingsBtn.addEventListener("click", handleSave);
  copyShareBtn.addEventListener("click", copyShareLink);

  quickScanBtn.addEventListener("click", function () { openScanner("batch"); });
  scanAddBtn.addEventListener("click", function () { openScanner("append"); });
  scannerCancel.addEventListener("click", cancelScanner);
  scanUndo.addEventListener("click", undoBatch);
  scanDone.addEventListener("click", finishBatch);

  // --- install as app ---

  var installBanner = document.getElementById("installBanner");
  var installBtn = document.getElementById("installBtn");
  var deferredInstall = null;

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstall = e;
    installBanner.hidden = false;
  });

  installBtn.addEventListener("click", function () {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    deferredInstall.userChoice.finally(function () {
      deferredInstall = null;
      installBanner.hidden = true;
    });
  });

  window.addEventListener("appinstalled", function () {
    installBanner.hidden = true;
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
